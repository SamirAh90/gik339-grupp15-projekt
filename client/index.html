<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Växtregister</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet" />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <header class="text-center position-relative"> <img
        src="https://images.unsplash.com/photo-1643392979567-c88f045da260?q=80&w=1740&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
        alt="Garden" class="header-image opacity-50 h-100 w-100" /> <h1
        class="display-1 fw-bold text-white position-absolute top-50 start-50 translate-middle">
        Växtregister </h1> </header>

    <main class="mt-5 container">
      <div id="feedbackModal" class="modal fade" tabindex="-1">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Info</h5>
              <button type="button" class="btn-close"
                data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary"
                data-bs-dismiss="modal">Stäng</button>
            </div>
          </div>
        </div>
      </div>

      <div class="bg-white bg-opacity-75 p-4 rounded shadow-sm mx-auto"
        style="max-width: 800px;">
        <h2 class="text-center mb-4">Hantera Växt</h2>
        <form id="plantForm">
          <input type="hidden" id="plantId" />

          <div class="mb-3 row">
            <label class="col-sm-3 fw-bold">Namn</label>
            <div class="col-sm-9">
              <input class="form-control" type="text" name="name" required />
            </div>
          </div>

          <div class="mb-3 row">
            <label class="col-sm-3 fw-bold">Typ</label>
            <div class="col-sm-9">
              <select class="form-select" name="species">
                <option value="Grönväxt">Grönväxt</option>
                <option value="Blommande">Blommande</option>
                <option value="Kaktus">Kaktus</option>
                <option value="Träd">Träd</option>
              </select>
            </div>
          </div>

          <div class="mb-3 row">
            <label class="col-sm-3 fw-bold">Vattning</label>
            <div class="col-sm-9">
              <select class="form-select" name="water">
                <option value="Lite">Lite</option>
                <option value="Lagom">Lagom</option>
                <option value="Mycket">Mycket</option>
              </select>
            </div>
          </div>

          <div class="mb-3 row">
            <label class="col-sm-3 fw-bold">Höjd (cm)</label>
            <div class="col-sm-9">
              <input class="form-control" type="number" name="height"
                required />
            </div>
          </div>

          <div class="mb-3 row">
            <label class="col-sm-3 fw-bold">Färg</label>
            <div class="col-sm-9">
              <input class="form-control" type="text" name="color" required
                placeholder="T.ex. Grön, Röd, Guld" />
              <div class="form-text">Färgen påverkar kortets utseende.</div>
            </div>
          </div>

          <div class="d-flex justify-content-end gap-3">
            <button class="btn btn-outline-secondary" type="button"
              id="clearBtn">Rensa</button>
            <button class="btn btn-success" type="submit">Spara</button>
          </div>
        </form>
      </div>

      <div id="listContainer" class="mt-5 mb-5"></div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
